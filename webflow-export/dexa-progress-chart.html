<!--
  Kalos DEXA Progress Chart, Webflow Embed
  ==========================================
  Drop this entire file into a Webflow "Embed" element (HTML Embed component).
  Self-contained: no external JS, no external CSS, no build step.

  - Real member journey: 6 scans across 6.5 months
  - Three lines: lean tissue (lbs, blue), fat tissue (lbs, red), visceral fat (cm², amber)
  - Left axis: lbs (40–120). Right axis: cm² (0–100)
  - Hover any scan dot to see the training, nutrition, and analyst insight,
    plus VAT and ALMI percentile per scan
  - Animates in on scroll

  All styles are scoped under .kalos-chart so they will not conflict
  with Webflow's page styles.
-->

<div class="kalos-chart">
  <div class="kc-card">
    <div class="kc-badge-row">
      <span class="kc-badge">Kalos member highlight</span>
    </div>

    <svg class="kc-svg" viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" fill="none">
      <!-- Grid lines, axes, legend, polylines, dots, all populated by JS -->
      <g class="kc-grid"></g>
      <g class="kc-y-labels"></g>
      <g class="kc-y-labels-right"></g>
      <g class="kc-x-labels"></g>

      <!-- Left axis (lbs), right axis (cm²), and bottom axis -->
      <line x1="55"  y1="40"  x2="55"  y2="320" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <line x1="500" y1="40"  x2="500" y2="320" stroke="rgba(245,158,11,0.2)"   stroke-width="1.5"/>
      <line x1="55"  y1="320" x2="500" y2="320" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

      <polyline class="kc-line kc-line-vat"  fill="none" stroke="#f59e0b" stroke-width="2"   stroke-linecap="round" stroke-linejoin="round"/>
      <polyline class="kc-line kc-line-fat"  fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline class="kc-line kc-line-lean" fill="none" stroke="#4A4AF4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <g class="kc-points"></g>

      <!-- Legend -->
      <circle cx="65"  cy="18" r="4" fill="#4A4AF4"/>
      <text   x="75"  y="22" fill="rgba(255,255,255,0.6)" style="font: 600 11px 'Inter', sans-serif;">Lean tissue (lbs)</text>
      <circle cx="195" cy="18" r="4" fill="#ef4444"/>
      <text   x="205" y="22" fill="rgba(255,255,255,0.6)" style="font: 600 11px 'Inter', sans-serif;">Fat tissue (lbs)</text>
      <circle cx="315" cy="18" r="4" fill="#f59e0b"/>
      <text   x="325" y="22" fill="rgba(255,255,255,0.6)" style="font: 600 11px 'Inter', sans-serif;">Visceral fat (cm²)</text>
    </svg>

    <!-- Hover tooltip (positioned by JS) -->
    <div class="kc-tooltip" hidden>
      <div class="kc-tip-head">
        <p class="kc-tip-label" data-tip="label"></p>
        <p class="kc-tip-time" data-tip="time"></p>
      </div>
      <div class="kc-tip-stats">
        <div class="kc-stat"><span class="kc-dot kc-dot-lean"></span><p>Lean: <strong data-tip="lean"></strong></p></div>
        <div class="kc-stat"><span class="kc-dot kc-dot-fat"></span><p>Fat: <strong data-tip="fat"></strong></p></div>
        <div class="kc-stat"><span class="kc-dot kc-dot-vat"></span><p>Visceral fat: <strong data-tip="vat"></strong></p></div>
        <div class="kc-stat"><span class="kc-dot kc-dot-bf"></span><p>Body fat: <strong data-tip="bf"></strong></p></div>
        <div class="kc-stat kc-stat-wide"><span class="kc-dot kc-dot-bf"></span><p>ALMI: <strong data-tip="almi"></strong></p></div>
      </div>
      <div class="kc-tip-body">
        <div class="kc-tip-section">
          <p class="kc-tip-section-h">Training</p>
          <p class="kc-tip-section-p" data-tip="training"></p>
        </div>
        <div class="kc-tip-section">
          <p class="kc-tip-section-h">Nutrition</p>
          <p class="kc-tip-section-p" data-tip="nutrition"></p>
        </div>
        <div class="kc-tip-insight">
          <p data-tip="insight"></p>
        </div>
      </div>
    </div>

    <p class="kc-hint" data-hint>Hover over each scan to see the story behind the numbers</p>
  </div>
</div>

<style>
  /* ─── Kalos DEXA Progress Chart (scoped) ─── */
  .kalos-chart {
    --kc-accent: #4A4AF4;
    --kc-red: #ef4444;
    --kc-text: #fff;
    --kc-text-muted: rgba(255, 255, 255, 0.6);
    --kc-text-dim: rgba(255, 255, 255, 0.35);
    --kc-border: rgba(255, 255, 255, 0.1);

    /* Self-contained dark wrapper */
    background: #000;
    padding: 32px 24px;
    border-radius: 16px;

    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--kc-text);
    max-width: 1100px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  .kalos-chart *,
  .kalos-chart *::before,
  .kalos-chart *::after { box-sizing: border-box; }

  .kalos-chart .kc-card {
    position: relative;
    background: #0A0A0A;
    border: 1px solid var(--kc-border);
    border-radius: 24px;
    padding: 24px;
  }

  .kalos-chart .kc-badge-row { margin-bottom: 16px; }
  .kalos-chart .kc-badge {
    display: inline-block;
    background: rgba(74, 74, 244, 0.15);
    color: var(--kc-accent);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 4px 12px;
    border-radius: 9999px;
  }

  .kalos-chart .kc-svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  .kalos-chart .kc-line {
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    transition: stroke-dashoffset 2s ease-out 0.3s;
  }
  .kalos-chart[data-animated="true"] .kc-line { stroke-dashoffset: 0; }

  .kalos-chart .kc-dot { transition: r 0.3s ease-out; }

  /* Hover tooltip card */
  .kalos-chart .kc-tooltip {
    position: absolute;
    z-index: 20;
    width: 340px;
    background: #1a1a1a;
    border: 1px solid var(--kc-border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    pointer-events: none;
    top: 15%;
  }
  .kalos-chart .kc-tooltip[hidden] { display: none; }

  .kalos-chart .kc-tip-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .kalos-chart .kc-tip-label {
    font-size: 14px;
    font-weight: 700;
    color: var(--kc-text);
    margin: 0;
  }
  .kalos-chart .kc-tip-time {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    margin: 0;
  }

  .kalos-chart .kc-tip-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    margin-bottom: 16px;
  }
  .kalos-chart .kc-stat {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .kalos-chart .kc-stat p {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
    margin: 0;
  }
  .kalos-chart .kc-stat strong {
    color: var(--kc-text);
    font-weight: 600;
  }
  .kalos-chart .kc-dot-lean,
  .kalos-chart .kc-dot-fat,
  .kalos-chart .kc-dot-vat,
  .kalos-chart .kc-dot-bf {
    width: 8px;
    height: 8px;
    border-radius: 9999px;
    display: inline-block;
  }
  .kalos-chart .kc-dot-lean { background: var(--kc-accent); }
  .kalos-chart .kc-dot-fat  { background: var(--kc-red); }
  .kalos-chart .kc-dot-vat  { background: #f59e0b; }
  .kalos-chart .kc-dot-bf   { background: rgba(255, 255, 255, 0.3); }
  .kalos-chart .kc-stat-wide { grid-column: 1 / -1; }

  .kalos-chart .kc-tip-body {
    border-top: 1px solid var(--kc-border);
    padding-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .kalos-chart .kc-tip-section-h {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--kc-accent);
    margin: 0 0 4px;
  }
  .kalos-chart .kc-tip-section-p {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    line-height: 1.6;
    margin: 0;
  }
  .kalos-chart .kc-tip-insight {
    border-top: 1px solid var(--kc-border);
    padding-top: 8px;
  }
  .kalos-chart .kc-tip-insight p {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.8);
    line-height: 1.6;
    font-style: italic;
    margin: 0;
  }

  .kalos-chart .kc-hint {
    text-align: center;
    font-size: 12px;
    color: var(--kc-text-dim);
    font-style: italic;
    margin: 8px 0 0;
  }
  .kalos-chart[data-hovered="true"] [data-hint] { visibility: hidden; }
  .kalos-chart[data-animated="false"] [data-hint] { visibility: hidden; }

  @media (max-width: 640px) {
    .kalos-chart { padding: 20px 12px; }
    .kalos-chart .kc-card { padding: 16px; }
    .kalos-chart .kc-tooltip { width: calc(100% - 32px); left: 16px !important; }
  }
</style>

<script>
(function() {
  var root = document.currentScript.parentElement.querySelector('.kalos-chart');
  if (!root) return;

  // ── Real Kalos member journey: 6 scans across ~6.5 months
  var scanData = [
    { label: 'Scan 1', time: 'Baseline', lean: 105.6, fat: 62.6, vat: 85.9, almi: 75,
      training: 'Former D1 softball player. Comfortable with compounds. Currently bikes 4–7x/week, coaches softball, weekend slow-pitch. Starting 2x/week recomp lifts (Tuesday + Friday).',
      nutrition: '~2,000 cal/day, 145g protein floor. Protein-forward meals, eggs, chicken, Greek yogurt, Fairlife. Going dry through the upcoming D.C. wedding with strict drink caps.',
      insight: 'Strong baseline, bone Z-score +1.7, ALMI 75th percentile. Body fat 36% and visceral fat elevated at 86 cm² (above the 80 threshold). Goal: aesthetics. Plan: steady fat loss while maintaining or slightly adding muscle.' },
    { label: 'Scan 2', time: 'Month 1', lean: 111.6, fat: 56.2, vat: 55.3, almi: 76,
      training: '18 of 18 primary workouts completed. Coach pushed intensity: every last rep of every set must be challenging, not just the last set. Squat working sets bumped 125 → 135.',
      nutrition: 'Tracked every meal in MyFitnessPal. Hit 145g protein daily. Calories naturally landed 1,000–1,500 (below the 2,000 target). Zero alcohol pre-wedding.',
      insight: 'Massive recomp month. +6 lbs lean, -6.4 lbs fat. Body fat 36 → 32.4%. Visceral fat cut by 36% (86 → 55 cm²). Committed to this 6-month membership.' },
    { label: 'Scan 3', time: 'Month 3', lean: 111.3, fat: 52.1, vat: 34.9, almi: 82,
      training: '18 of 18 primary workouts since the last scan. Strength climbing fast: leg press 240 x 10, lat pulldown 100 x 8, estimated squat 1RM ~185.',
      nutrition: 'Reintroduced alcohol mindfully (Halloween, football weekend, Thanksgiving). Never more than 5 drinks across a day. Got creative with protein recipes. Brought in nutrition specialist Sophie for a women\u2019s-health deep-dive.',
      insight: 'Held the line through the hardest period of the year. Body fat 32.4 → 30.8%. Visceral fat 55 → 35 cm² (now in healthy range). ALMI percentile 76 → 82.' },
    { label: 'Scan 4', time: 'Month 4', lean: 111.0, fat: 49.9, vat: 27.4, almi: 86,
      training: 'Didn\u2019t miss a single weightlifting session through the holidays. Strength climbing: incline DB press 70 lb x 10 for 4 sets, leg press 260 x 12. Coach adding more anti-rotational core work.',
      nutrition: 'Held protein religiously through the holidays + a ski weekend + multiple work parties. Limited alcohol (half a White Claw at Christmas, max 3 drinks/day at New Year\u2019s). Adding fiber focus (~25g/day) and Locale meal delivery for vitamins/micros.',
      insight: '-2.2 lbs total, all fat. Body fat 30.8 → 29.9%. Visceral fat 35 → 27 cm². ALMI percentile 82 → 86. Lean held flat (small trunk drop attributed to water/bloat) but appendicular muscle is still growing.' },
    { label: 'Scan 5', time: 'Month 5', lean: 110.5, fat: 46.6, vat: 32.6, almi: 87,
      training: 'Switched barbell deadlifts to trap-bar after some lower-back tightness. Added CorePower hot yoga sculpt 1–2x/week as a paired cardio modality. Strength still climbing: 70 lb dumbbell bench press confirmed.',
      nutrition: 'Held the line through D.C. and Chicago travel. Brought protein powder when staying with friends. Alcohol limited to a glass of wine here and there, mindful nighttime drinking only.',
      insight: '-3.6 lbs total, of which -3.3 lbs fat. Lean held: small trunk drop attributed to water, while both arms and legs gained muscle. 16 lbs total fat lost from baseline. Body fat 29.9 → 28.6%. ALMI percentile 87. VAT ticked up slightly from sleep and red-eye flights, still in healthy range.' },
    { label: 'Scan 6', time: 'Month 7', lean: 112.0, fat: 43.2, vat: 17.5, almi: 88,
      training: 'Hitting 7K daily steps consistently. Strength still climbing: barbell bench 85 x 10, front squat 145 x 8, trap-bar deadlift 165 x 8, reverse-grip pulldowns up to 120 lb. Working toward her first strict pull-up. Started creatine.',
      nutrition: 'Held the foundation: protein floor + sustainable deficit. Coaching tournaments slotted into the routine without disrupting the rhythm.',
      insight: 'First true recomp scan. +1.5 lbs lean (legs evened out the prior 2 lb imbalance), -3.4 lbs fat. Body fat 28.6 → 26.9%. Visceral fat 33 → 17.5 cm². Coach Sophie called it "one of the lowest I\u2019ve ever seen." 6.5 months in: -13 lbs weight, -19 lbs fat, +6.4 lbs lean, body fat down 9 points.' }
  ];

  // ── Chart geometry (matches viewBox)
  var pad   = { top: 40, right: 60, bottom: 60, left: 55 };
  var w = 560, h = 380;
  var innerW = w - pad.left - pad.right;
  var innerH = h - pad.top - pad.bottom;
  // Left axis (lean & fat in lbs)
  var yMin = 40, yMax = 120;
  var yRange = yMax - yMin;
  // Right axis (visceral fat in cm²)
  var vatMin = 0, vatMax = 100;
  var vatRange = vatMax - vatMin;

  var toX    = function(i) { return pad.left + (i / (scanData.length - 1)) * innerW; };
  var toY    = function(v) { return pad.top + innerH - ((v - yMin)   / yRange)   * innerH; };
  var toVatY = function(v) { return pad.top + innerH - ((v - vatMin) / vatRange) * innerH; };

  var yTicks   = [40, 60, 80, 100, 120];
  var vatTicks = [0, 25, 50, 75, 100];

  var svgNS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs) {
    var n = document.createElementNS(svgNS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function txt(tag, attrs, content) {
    var n = el(tag, attrs);
    n.textContent = content;
    return n;
  }

  // Grid (aligned to left-axis ticks)
  var gGrid = root.querySelector('.kc-grid');
  yTicks.forEach(function(t) {
    gGrid.appendChild(el('line', {
      x1: pad.left, y1: toY(t), x2: w - pad.right, y2: toY(t),
      stroke: 'rgba(255,255,255,0.06)', 'stroke-width': '1'
    }));
  });

  // Y-axis labels, left (lbs)
  var gY = root.querySelector('.kc-y-labels');
  yTicks.forEach(function(t) {
    gY.appendChild(txt('text', {
      x: pad.left - 10, y: toY(t) + 4,
      'text-anchor': 'end', fill: 'rgba(255,255,255,0.35)',
      style: "font: 11px 'Inter', sans-serif;"
    }, t + ' lbs'));
  });

  // Y-axis labels, right (cm²)
  var gYR = root.querySelector('.kc-y-labels-right');
  vatTicks.forEach(function(t) {
    gYR.appendChild(txt('text', {
      x: w - pad.right + 10, y: toVatY(t) + 4,
      'text-anchor': 'start', fill: 'rgba(245,158,11,0.55)',
      style: "font: 11px 'Inter', sans-serif;"
    }, t + ' cm²'));
  });

  // X-axis labels
  var gX = root.querySelector('.kc-x-labels');
  scanData.forEach(function(s, i) {
    gX.appendChild(txt('text', {
      x: toX(i), y: h - 22, 'text-anchor': 'middle',
      fill: 'rgba(255,255,255,0.5)',
      style: "font: 600 11px 'Inter', sans-serif;"
    }, s.label));
    gX.appendChild(txt('text', {
      x: toX(i), y: h - 8, 'text-anchor': 'middle',
      fill: 'rgba(255,255,255,0.3)',
      style: "font: 9px 'Inter', sans-serif;"
    }, s.time));
  });

  // Polylines
  var leanPts = scanData.map(function(s, i) { return toX(i) + ',' + toY(s.lean); }).join(' ');
  var fatPts  = scanData.map(function(s, i) { return toX(i) + ',' + toY(s.fat);  }).join(' ');
  var vatPts  = scanData.map(function(s, i) { return toX(i) + ',' + toVatY(s.vat); }).join(' ');
  root.querySelector('.kc-line-lean').setAttribute('points', leanPts);
  root.querySelector('.kc-line-fat').setAttribute('points', fatPts);
  root.querySelector('.kc-line-vat').setAttribute('points', vatPts);

  // Scan dots, value labels, hover targets
  var gPoints = root.querySelector('.kc-points');
  var dotsByIndex = [];
  scanData.forEach(function(s, i) {
    var x = toX(i);
    var leanY = toY(s.lean), fatY = toY(s.fat), vatY = toVatY(s.vat);

    // Vertical connector (dashed) between lean and fat
    var connector = el('line', {
      x1: x, y1: leanY, x2: x, y2: fatY,
      stroke: 'rgba(255,255,255,0.08)', 'stroke-width': '1', 'stroke-dasharray': '4 3',
      opacity: '0',
      style: 'transition: opacity 0.4s ease-out ' + (0.5 + i * 0.3) + 's, stroke 0.2s;'
    });
    gPoints.appendChild(connector);

    // Halo + dot for lean
    var leanHalo = el('circle', { cx: x, cy: leanY, r: '0', fill: '#4A4AF4', opacity: '0.15',
      style: 'transition: r 0.3s ease-out ' + (0.4 + i * 0.3) + 's;' });
    var leanDot  = el('circle', { cx: x, cy: leanY, r: '0', fill: '#4A4AF4',
      style: 'transition: r 0.3s ease-out ' + (0.4 + i * 0.3) + 's;' });
    gPoints.appendChild(leanHalo);
    gPoints.appendChild(leanDot);

    var leanLabel = txt('text', {
      x: x, y: leanY - 14, 'text-anchor': 'middle', fill: '#4A4AF4',
      style: "font: 700 10px 'Inter', sans-serif;",
      opacity: '0'
    }, s.lean + ' lbs');
    gPoints.appendChild(leanLabel);

    // Halo + dot for fat
    var fatHalo = el('circle', { cx: x, cy: fatY, r: '0', fill: '#ef4444', opacity: '0.15',
      style: 'transition: r 0.3s ease-out ' + (0.4 + i * 0.3) + 's;' });
    var fatDot  = el('circle', { cx: x, cy: fatY, r: '0', fill: '#ef4444',
      style: 'transition: r 0.3s ease-out ' + (0.4 + i * 0.3) + 's;' });
    gPoints.appendChild(fatHalo);
    gPoints.appendChild(fatDot);

    var fatLabel = txt('text', {
      x: x, y: fatY + 22, 'text-anchor': 'middle', fill: '#ef4444',
      style: "font: 700 10px 'Inter', sans-serif;",
      opacity: '0'
    }, s.fat + ' lbs');
    gPoints.appendChild(fatLabel);

    // Halo + dot for VAT (no inline label, kept clean, value shown on hover)
    var vatHalo = el('circle', { cx: x, cy: vatY, r: '0', fill: '#f59e0b', opacity: '0.18',
      style: 'transition: r 0.3s ease-out ' + (0.4 + i * 0.3) + 's;' });
    var vatDot  = el('circle', { cx: x, cy: vatY, r: '0', fill: '#f59e0b',
      style: 'transition: r 0.3s ease-out ' + (0.4 + i * 0.3) + 's;' });
    gPoints.appendChild(vatHalo);
    gPoints.appendChild(vatDot);

    // Invisible hover target (covers full chart height)
    var hit = el('rect', {
      x: x - 25, y: pad.top, width: '50', height: innerH,
      fill: 'transparent', style: 'cursor: pointer;'
    });
    hit.addEventListener('mouseenter', function() { showTooltip(i); });
    hit.addEventListener('mouseleave', function() { hideTooltip(); });
    hit.addEventListener('click',      function() { showTooltip(i); });
    gPoints.appendChild(hit);

    dotsByIndex.push({
      leanDot: leanDot, leanHalo: leanHalo, leanLabel: leanLabel,
      fatDot:  fatDot,  fatHalo:  fatHalo,  fatLabel:  fatLabel,
      vatDot:  vatDot,  vatHalo:  vatHalo,
      connector: connector
    });
  });

  function setIdleSizes(d) {
    d.leanDot.setAttribute('r', '5');
    d.leanHalo.setAttribute('r', '10');
    d.fatDot.setAttribute('r', '5');
    d.fatHalo.setAttribute('r', '10');
    d.vatDot.setAttribute('r', '4');
    d.vatHalo.setAttribute('r', '8');
    d.leanLabel.setAttribute('opacity', '0.6');
    d.fatLabel.setAttribute('opacity', '0.6');
  }

  // Animate in on scroll
  function animateIn() {
    root.dataset.animated = 'true';
    dotsByIndex.forEach(function(d) {
      setIdleSizes(d);
      d.connector.setAttribute('opacity', '1');
    });
  }

  // Hover state
  var tooltip = root.querySelector('.kc-tooltip');
  function showTooltip(i) {
    var s = scanData[i];
    root.dataset.hovered = 'true';
    tooltip.removeAttribute('hidden');
    tooltip.querySelector('[data-tip="label"]').textContent = s.label;
    tooltip.querySelector('[data-tip="time"]').textContent  = s.time;
    tooltip.querySelector('[data-tip="lean"]').textContent  = s.lean + ' lbs';
    tooltip.querySelector('[data-tip="fat"]').textContent   = s.fat + ' lbs';
    tooltip.querySelector('[data-tip="vat"]').textContent   = s.vat + ' cm²';
    tooltip.querySelector('[data-tip="bf"]').textContent    = (s.fat / (s.lean + s.fat) * 100).toFixed(1) + '%';
    tooltip.querySelector('[data-tip="almi"]').textContent  = s.almi + 'th percentile';
    tooltip.querySelector('[data-tip="training"]').textContent  = s.training;
    tooltip.querySelector('[data-tip="nutrition"]').textContent = s.nutrition;
    tooltip.querySelector('[data-tip="insight"]').textContent   = s.insight;

    // Position: tooltip anchors right when hovering early scans, left for late scans
    tooltip.style.left = (i <= 2) ? '60%' : '10%';

    // Emphasize the hovered dot
    dotsByIndex.forEach(function(d, idx) {
      var hov = idx === i;
      d.leanDot.setAttribute('r',  hov ? '7'  : '5');
      d.leanHalo.setAttribute('r', hov ? '14' : '10');
      d.fatDot.setAttribute('r',   hov ? '7'  : '5');
      d.fatHalo.setAttribute('r',  hov ? '14' : '10');
      d.vatDot.setAttribute('r',   hov ? '6'  : '4');
      d.vatHalo.setAttribute('r',  hov ? '12' : '8');
      d.leanLabel.setAttribute('opacity', hov ? '1' : '0.6');
      d.fatLabel.setAttribute('opacity',  hov ? '1' : '0.6');
      d.connector.setAttribute('stroke', hov ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.08)');
    });
  }
  function hideTooltip() {
    delete root.dataset.hovered;
    tooltip.setAttribute('hidden', '');
    dotsByIndex.forEach(function(d) {
      setIdleSizes(d);
      d.connector.setAttribute('stroke', 'rgba(255,255,255,0.08)');
    });
  }

  // IntersectionObserver kicks off the animation when the chart enters view
  root.dataset.animated = 'false';
  if ('IntersectionObserver' in window) {
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (e.isIntersecting) {
          animateIn();
          obs.unobserve(root);
        }
      });
    }, { threshold: 0.3 });
    obs.observe(root);
  } else {
    animateIn();
  }
})();
</script>
